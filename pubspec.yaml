name: lrs_sangeet_duniya
description: LR's Sangeet_Duniya - free music app with background playback and Sangeeta companion.
publish_to: "none"
version: 0.5.0+6

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  cupertino_icons: ^1.0.8
  permission_handler: ^13.0.2
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  http: ^1.6.0
  crypto: ^3.0.7
  rive: ^0.14.11
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Brand artwork is kept as source material for release tooling.
