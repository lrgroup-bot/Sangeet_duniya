name: lrs_sangeet_duniya
description: LR's Sangeet_Duniya - free music app with background playback and Sangeeta companion.
publish_to: "none"
version: 2.0.0+20

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  cupertino_icons: ^1.0.8
  permission_handler: ^13.0.2
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  http: ^1.6.0
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  share_plus: ^11.0.0
  ffmpeg_kit_flutter_new_audio: ^2.5.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/lrs_3d_brand.jpg

# Brand artwork is kept as source material for release tooling.
