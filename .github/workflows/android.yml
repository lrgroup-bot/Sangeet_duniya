name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, tailscale-admin ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.lrs.sangeet .

      - name: Install logo rendering tools
        run: python3 -m pip install --disable-pip-version-check -q pillow cairosvg

      - name: Patch Android media service and launcher icon
        run: python3 tool/prepare_android.py

      - name: Check PC Tailscale server
        run: python3 -m py_compile tools/tailscale_admin_server.py
      - name: Check Windows watchdog PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/windows_lrs_server_watchdog.ps1', [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          Write-Host 'Windows watchdog PowerShell syntax OK.'

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lrs-sangeet-duniya-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lrs-sangeet-duniya-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare GitHub Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/tailscale-admin'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "LRS-Sangeet-Duniya-v1.0.0.apk"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/tailscale-admin'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v1.0.0"
          name: "LR's Sangeet_Duniya v1.0.0"
          prerelease: false
          generate_release_notes: true
          files: "LRS-Sangeet-Duniya-v1.0.0.apk"
