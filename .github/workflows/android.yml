name: Android CI

on:
  push:
    branches: [ main, tailscale-admin ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.lrs.sangeet .

      - name: Prepare Android assets
        run: |
          python3 -m pip install --disable-pip-version-check -q pillow cairosvg
          python3 tool/prepare_android.py

      - name: Validate PC tools
        run: python3 -m py_compile tools/tailscale_admin_server.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lrs-sangeet-duniya-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/tailscale-admin'
        run: cp build/app/outputs/flutter-apk/app-release.apk "LRS-Sangeet-Duniya-v1.0.0.apk"

      - name: GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/tailscale-admin'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v1.0.0"
          name: "LR's Sangeet_Duniya v1.0.0"
          prerelease: false
          generate_release_notes: true
          files: "LRS-Sangeet-Duniya-v1.0.0.apk"
