name: Sangeet_Duniya v2.2 Build & Release

concurrency:
  group: sangeet-v22-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    name: Android verify + signed APK
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_STORE_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.lrs.sangeet .

      - name: Install release tooling
        run: python3 -m pip install --disable-pip-version-check -q pillow cairosvg

      - name: Configure persistent release signing
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Patch Android media service, icon and signing
        run: python3 tool/prepare_android.py

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Windows admin server tests
        run: python3 -m unittest discover -s admin_server/tests -v

      - name: Compile Python server scripts
        run: python3 -m py_compile admin_server/server.py tool/prepare_android.py tool/prepare_ios.py

      - name: Parse Windows watchdog PowerShell
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'admin_server/windows_watchdog.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Watchdog health self-test
        shell: pwsh
        run: |
          ./admin_server/windows_watchdog.ps1 -Mode SelfTest -RepoRoot "$PWD"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Require release key on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING != 'true'
        run: |
          echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and ANDROID_STORE_PASSWORD repository secrets."
          exit 1

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        run: flutter build apk --release

      - name: Read app version
        id: version
        shell: bash
        run: |
          RAW="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          VERSION="${RAW%%+*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature and prepare release asset
        if: env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "LRs-Sangeet-Duniya-v${{ steps.version.outputs.version }}.apk"
          sha256sum "LRs-Sangeet-Duniya-v${{ steps.version.outputs.version }}.apk" > "LRs-Sangeet-Duniya-v${{ steps.version.outputs.version }}.apk.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lrs-sangeet-duniya-v2.2-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload signed release APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lrs-sangeet-duniya-v2.2-signed
          path: |
            LRs-Sangeet-Duniya-v${{ steps.version.outputs.version }}.apk
            LRs-Sangeet-Duniya-v${{ steps.version.outputs.version }}.apk.sha256

      - name: Publish automatic GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LR's Sangeet_Duniya ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            LRs-Sangeet-Duniya-v${{ steps.version.outputs.version }}.apk
            LRs-Sangeet-Duniya-v${{ steps.version.outputs.version }}.apk.sha256

  ios:
    name: iOS no-codesign verification
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform
        run: flutter create --platforms=ios --org com.lrs.sangeet .

      - name: Patch iOS audio and local-network permissions
        run: python3 tool/prepare_ios.py

      - name: Get packages
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
