name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, tailscale-admin ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.lrs.sangeet .

      - name: Install logo rendering tools
        run: python3 -m pip install --disable-pip-version-check -q pillow cairosvg

      - name: Patch Android media service and launcher icon
        run: python3 tool/prepare_android.py

      - name: Check PC Tailscale server
        run: python3 -m py_compile tools/tailscale_admin_server.py

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lrs-sangeet-duniya-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
