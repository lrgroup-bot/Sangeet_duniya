<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020202"/><stop offset=".5" stop-color="#171005"/><stop offset="1" stop-color="#030303"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF6C7"/><stop offset=".22" stop-color="#FFD76A"/>
    <stop offset=".5" stop-color="#FFB52A"/><stop offset=".74" stop-color="#FFF0A6"/><stop offset="1" stop-color="#9A5A00"/>
  </linearGradient>
  <linearGradient id="goldDeep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE889"/><stop offset=".5" stop-color="#FFB21F"/><stop offset="1" stop-color="#7A4300"/>
  </linearGradient>
  <radialGradient id="skin" cx=".45" cy=".34" r=".7">
    <stop offset="0" stop-color="#FFE6D8"/><stop offset=".6" stop-color="#E7A78B"/><stop offset="1" stop-color="#A95E4D"/>
  </radialGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3A1A10"/><stop offset=".45" stop-color="#160B08"/><stop offset="1" stop-color="#050303"/>
  </linearGradient>
  <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3A2813"/><stop offset=".35" stop-color="#17100A"/><stop offset="1" stop-color="#050505"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".75"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>

<rect width="1024" height="1024" rx="190" fill="url(#bg)"/>
<rect x="28" y="28" width="968" height="968" rx="166" fill="none" stroke="#5F3A00" stroke-width="28" opacity=".7"/>
<rect x="36" y="36" width="952" height="952" rx="158" fill="none" stroke="url(#gold)" stroke-width="16" filter="url(#glow)"/>

<g opacity=".9" filter="url(#soft)" fill="none" stroke="url(#gold)" stroke-linecap="round">
  <path d="M78 704 C220 585 335 585 458 648 C604 722 748 665 938 508" stroke-width="7"/>
  <path d="M70 760 C214 646 340 650 470 710 C612 775 765 731 946 585" stroke-width="4"/>
</g>

<!-- 3D avatar body -->
<path d="M214 926 C245 760 348 676 512 676 C676 676 780 764 812 926 Z"
